name: CI/CD pipeline with minimized DB 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all services'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      seed: ${{ steps.filter.outputs.seed }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
            seed:
              - 'seed/**'
              - 'docker-compose.yml'

  lint-backend:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        if: needs.detect-changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Checkstyle
        working-directory: backend
        if: needs.detect-changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: mvn checkstyle:check 

  lint-frontend:
    name: ESLint
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - name: Checkout code
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npm ci --prefix frontend

      - name: Run ESLint
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npm run lint --prefix frontend

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-backend, lint-frontend]
    permissions:
      packages: write
      contents: read
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ----------------------
      # BACKEND
      # ----------------------
      - name: Build backend (if changed)
        if: needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          docker build \
            -t $REGISTRY/backend:${IMAGE_TAG} \
            -t $REGISTRY/backend:main \
            -t $REGISTRY/backend:latest \
            backend

      - name: Retag backend (if unchanged)
        if: needs.detect-changes.outputs.backend != 'true' && github.event.inputs.force_rebuild != 'true'
        run: |
          docker pull $REGISTRY/backend:main
          docker tag $REGISTRY/backend:main $REGISTRY/backend:${IMAGE_TAG}
          docker tag $REGISTRY/backend:main $REGISTRY/backend:latest

      - name: Push backend
        run: |
          docker push $REGISTRY/backend:${IMAGE_TAG}
          docker push $REGISTRY/backend:main
          docker push $REGISTRY/backend:latest

      # ----------------------
      # FRONTEND
      # ----------------------
      - name: Build frontend (if changed)
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          docker build \
            -t $REGISTRY/frontend:${IMAGE_TAG} \
            -t $REGISTRY/frontend:main \
            -t $REGISTRY/frontend:latest \
            frontend

      - name: Retag frontend (if unchanged)
        if: needs.detect-changes.outputs.frontend != 'true' && github.event.inputs.force_rebuild != 'true'
        run: |
          docker pull $REGISTRY/frontend:main
          docker tag $REGISTRY/frontend:main $REGISTRY/frontend:${IMAGE_TAG}
          docker tag $REGISTRY/frontend:main $REGISTRY/frontend:latest

      - name: Push frontend
        run: |
          docker push $REGISTRY/frontend:${IMAGE_TAG}
          docker push $REGISTRY/frontend:main
          docker push $REGISTRY/frontend:latest

      # ----------------------
      # SEED
      # ----------------------
      - name: Build seed (if changed)
        if: needs.detect-changes.outputs.seed == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          docker build \
            -t $REGISTRY/seed:${IMAGE_TAG} \
            -t $REGISTRY/seed:main \
            -t $REGISTRY/seed:latest \
            seed

      - name: Retag seed (if unchanged)
        if: needs.detect-changes.outputs.seed != 'true' && github.event.inputs.force_rebuild != 'true'
        run: |
          docker pull $REGISTRY/seed:main
          docker tag $REGISTRY/seed:main $REGISTRY/seed:${IMAGE_TAG}
          docker tag $REGISTRY/seed:main $REGISTRY/seed:latest

      - name: Push seed
        run: |
          docker push $REGISTRY/seed:${IMAGE_TAG}
          docker push $REGISTRY/seed:main
          docker push $REGISTRY/seed:latest

  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: |
          cat > .env << EOF
          IMAGE_TAG=${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository }}
          BACKEND_PORT=8080
          FRONTEND_PORT=3000
          DB_PORT=5432
          DB_NAME=test_db
          DB_ADMIN=test_admin
          DB_ADMIN_PASSWORD=test_password
          DB_USER=test_user
          DB_USER_PASSWORD=test_password
          DB_HOST=db
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=${{ secrets.CI_NEXTAUTH_SECRET }}
          GITLAB_CLIENT_ID=test-gitlab-client-id
          GITLAB_CLIENT_SECRET=test-gitlab-client-secret
          GOOGLE_CLIENT_ID=test-google-client-id
          GOOGLE_CLIENT_SECRET=test-google-client-secret
          CSV_PATH=seed/data/shoreline_buildings.csv
          EOF

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Start services
        run: docker compose pull && docker compose up -d --wait

      - name: Show image digests
        run: docker compose images
      
      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8080/api/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman tests
        run: |
          newman run tests/postman_collection.json \
            --environment tests/ci.postman_environment.json \
            --reporters cli \
            --verbose

      - name: Tear down services
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DO_PRODUCTION_HOST: ${{ secrets.DO_PRODUCTION_HOST }}
      DO_PRODUCTION_HOST_USER: ${{ secrets.DO_PRODUCTION_HOST_USER }}
      DO_PRODUCTION_HOST_DEPLOY_PATH: ${{ secrets.O_PRODUCTION_HOST_DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-client   
          eval "$(ssh-agent -s)"
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $DO_PRODUCTION_HOST >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
    
      - name: Ensure deploy path exists
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            $PRODUCTION_HOST_USER@$PRODUCTION_HOST \
            "mkdir -p $PRODUCTION_HOST_DEPLOY_PATH"
      
      - name: Copy docker compose and init files to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
          $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST << EOF
            mkdir -p $DO_PRODUCTION_HOST_DEPLOY_PATH/db
            mkdir -p $DO_PRODUCTION_HOST_DEPLOY_PATH/seed/data
            exit
          EOF
          
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            docker-compose.yml \
            $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST:$DO_PRODUCTION_HOST_DEPLOY_PATH/
            
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            ./db/01-init.sql \
            $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST:$DO_PRODUCTION_HOST_DEPLOY_PATH/db/
            
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            ./db/02-init-db.sh \
            $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST:$DO_PRODUCTION_HOST_DEPLOY_PATH/db/
            
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            ./seed/data/shoreline_buildings.csv \
            $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST:$DO_PRODUCTION_HOST_DEPLOY_PATH/seed/data/

      - name: Create .env on server
        run: |
          ssh -i ~/.ssh/id_ed25519 $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST << EOF
            cd $DO_PRODUCTION_HOST_DEPLOY_PATH
            
            # Create .env file directly on server
            cat > .env << ENVEOF
            DO_PRODUCTION_HOST=$DO_PRODUCTION_HOST
            DO_PRODUCTION_HOST_USER=$DO_PRODUCTION_HOST_USER
            DO_PRODUCTION_HOST_DEPLOY_PATH=$DO_PRODUCTION_HOST_DEPLOY_PATH
            IMAGE_TAG=${{ github.sha }}
            REGISTRY=ghcr.io/${{ github.repository }}
            BACKEND_PORT=8080
            FRONTEND_PORT=3000
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}
            DB_ADMIN=${{ secrets.DB_ADMIN }}
            DB_ADMIN_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}
            DB_USER=${{ secrets.DB_USER }}
            DB_USER_PASSWORD=${{ secrets.DB_USER_PASSWORD }}
            DB_HOST=db
            NEXTAUTH_URL=http://localhost:3000
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            GITLAB_CLIENT_ID=${{ secrets.GITLAB_CLIENT_ID }}
            GITLAB_CLIENT_SECRET=${{ secrets.GITLAB_CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            CSV_PATH=seed/data/shoreline_buildings.csv
            ENVEOF
          EOF
        
      - name: Deploy application
        run: |
          ssh -i ~/.ssh/id_ed25519 $DO_PRODUCTION_HOST_USER@$DO_PRODUCTION_HOST << EOF
            cd $DO_PRODUCTION_HOST_DEPLOY_PATH
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose up -d db
            docker compose up seed
            docker compose up -d backend
            docker compose up -d frontend
            echo "Docker containers after deploy:"
            sudo docker ps --format "table {{.ID}}\t{{.Image}}\t{{.Names}}\t{{.Status}}"
            exit
          EOF
